<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mara Veil | Visual Artist &amp; Multidisciplinary Creative</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mute:#8a8780;--gray:#bdbdbd;--line:#e4e2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--fg:#f2f0ea;--mute:#8f8c84;--gray:#2a2a2a;--line:#2b2a27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101010;--fg:#f2f0ea;--mute:#8f8c84;--gray:#2a2a2a;--line:#2b2a27;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 13px/1.4 'Archivo',system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.D{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
#ld{position:fixed;inset:0;z-index:100;display:grid;place-items:center}
#ld.x{pointer-events:none}
#ld.x svg,#ld.x #pc{opacity:0}
#pc,#ld svg{z-index:1;transition:opacity .3s}
.stairs{position:absolute;inset:0;display:flex}
.stairs i{flex:1;background:var(--bg);transition:transform .8s cubic-bezier(.7,0,.2,1)}
#ld.x .stairs i{transform:translateY(-100%);transition-delay:calc(var(--i)*.09s + .25s)}
#ld svg{width:min(420px,80vw);overflow:visible}
#ld path{fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.6s cubic-bezier(.45,.05,.35,1) forwards}
#ld circle{fill:var(--fg);opacity:0;animation:dot .2s 2.5s forwards}
@keyframes dot{to{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:var(--fg)}}
#pc{position:absolute;bottom:28px;font-size:12px}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;padding:14px 22px;pointer-events:none;mix-blend-mode:difference;color:#fff}
header>*{pointer-events:auto}
.logo{font-size:clamp(26px,4vw,44px);line-height:1}
.menu{display:grid;grid-template-columns:auto auto;gap:0 38px;font-size:11px;text-transform:uppercase;font-weight:500}
.menu a,.menu button{display:block;padding:1px 0}.menu a:hover,.menu button:hover{text-decoration:underline}
.pg{min-height:100vh;padding-top:96px}
/* reel */
#reel{height:100vh;background:var(--gray);display:flex;align-items:center;gap:6vw;padding:0 8vw;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
#reel::-webkit-scrollbar{display:none}
.fr{flex:none;position:relative;width:min(22vw,260px);aspect-ratio:4/5;scroll-snap-align:center;transition:all .6s cubic-bezier(.7,0,.2,1);border:5px solid #1c1c1c;box-shadow:0 14px 30px rgba(0,0,0,.25);overflow:hidden}
.fr svg{width:100%;height:100%;display:block;object-fit:cover}
.fr b{position:absolute;left:10px;bottom:10px;color:#fff;font:400 14px 'Anton';text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#reel:hover .fr{opacity:.55}#reel .fr:hover{opacity:1;width:min(46vw,520px);margin:0 2vw}
/* grid */
.sub{display:flex;gap:22px;padding:0 22px 14px;font-weight:500;text-transform:uppercase;font-size:11px}
.sub .on{border-bottom:1px solid var(--fg)}
.sw{display:flex;gap:8px;padding:0 22px 18px}.sw i{width:22px;height:22px;border-radius:50%;cursor:pointer;display:block}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:56px 34px;padding:30px 22px 80px}
.th{display:block}.th svg{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));transition:transform .4s}.th:hover svg{transform:translateY(-6px)}
.th span{display:block;margin-top:10px;color:var(--mute)}
/* series viewer */
.vw{height:100vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:90px 22px 150px}
.vw .L{font-weight:500;text-transform:uppercase;font-size:11px}.vw .R{justify-self:end;text-align:right;font-weight:500;text-transform:uppercase;font-size:11px}
.vw .m svg{display:block;height:min(62vh,560px);width:auto;filter:drop-shadow(0 18px 28px rgba(0,0,0,.22));cursor:pointer}
.st{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:12px;padding:12px 22px;overflow-x:auto;background:var(--bg);z-index:40;align-items:flex-end}
.st button{flex:none;opacity:.5}.st button.on{opacity:1}.st svg{height:70px;width:auto;display:block}
.pr{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);font-size:11px;z-index:41}
/* product */
.pd{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:100px 22px 160px;flex-wrap:wrap}
.pd svg{height:min(66vh,600px);width:auto;max-width:90vw;filter:drop-shadow(0 20px 36px rgba(0,0,0,.25))}
.pd h1{font-size:18px;margin-bottom:10px}.pd p{margin-bottom:2px}
.bt{display:inline-block;margin-top:16px;border:1px solid var(--fg);padding:9px 14px;font-size:11px;font-weight:500}.bt:hover{background:var(--fg);color:var(--bg)}
.band{position:absolute;left:0;right:0;bottom:0;height:110px}
/* collage */
.cl{position:relative;height:calc(100vh - 20px);overflow:hidden}
.cl a{position:absolute;display:block;transition:transform .5s,z-index 0s;box-shadow:0 10px 24px rgba(0,0,0,.2)}.cl a:hover{transform:scale(1.08) rotate(0);z-index:20!important}.cl svg{display:block;width:100%;height:auto}
/* about / contact */
.ab{padding:0 22px 80px;max-width:1100px;margin:auto}.ab h1{font-size:clamp(56px,14vw,190px);line-height:.9;display:flex;justify-content:space-between;margin-bottom:40px}
.ab p{max-width:58ch;font-size:15px;margin-bottom:1em}
.tb{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:6px 18px;font-size:11px;text-transform:uppercase;border-top:1px solid var(--line);padding-top:16px;margin-top:40px}
.ct{height:100vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}.ct .D{font-size:clamp(28px,5vw,60px)}
.ct form{display:grid;gap:10px;width:min(300px,70vw);margin:auto}
.ct input,.ct textarea{font:inherit;background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--fg);padding:6px 0;border-radius:0}
footer{display:flex;justify-content:space-between;padding:22px;font-size:11px;color:var(--mute)}footer div{display:flex;gap:18px}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:70;transform:translateX(100%);transition:transform .4s;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 22px;display:flex;flex-direction:column;gap:12px}
#cart.o{transform:none}#cart ul{list-style:none;padding:0;flex:1;overflow:auto}#cart li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){.fr{width:56vw}#reel .fr:hover{width:70vw}.vw,.ct{grid-template-columns:1fr}.vw .L,.vw .R{display:none}.tb{grid-template-columns:50px 1fr}.menu{gap:0 18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#ld path{stroke-dashoffset:0}#ld circle{opacity:1}}
</style></head><body>
<div id="ld"><div class="stairs"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i></div><svg viewBox="0 0 310 110" aria-label="Shivam signature"><path pathLength="1" d="M20 72C26 56 44 50 46 60C48 70 24 66 26 78C28 90 50 82 56 66C60 40 70 14 76 14C82 14 72 60 66 84C68 62 72 56 80 54C90 52 92 66 90 74C90 80 94 84 99 80C104 76 104 70 106 64C108 72 108 80 112 78C114 70 114 58 118 54C124 56 124 76 126 80C130 70 134 56 140 54C146 52 156 54 150 68C146 78 138 78 142 68C146 60 160 58 162 70C164 80 166 84 172 78C174 70 176 58 180 56C184 54 184 76 186 80C188 62 194 54 200 56C206 58 204 76 208 82C210 62 218 54 224 58C230 62 226 78 238 80C260 84 280 74 298 60"/><circle cx="105" cy="44" r="3"/></svg><span id="pc">000%</span></div>
<header><a class="logo D" href="#">Mara Veil</a>
<nav class="menu"><a href="#grid">Artwork</a><a href="#about">About</a><a href="#drawings">Drawings</a><a href="#contact">Contact</a><a href="#embroideries">Embroideries</a><button id="cb">Cart (<span id="cc">0</span>)</button></nav></header>
<main id="v"></main>
<aside id="cart" aria-label="Cart"><div style="display:flex;justify-content:space-between"><b>Cart</b><button id="cx">Close</button></div><ul id="cl"></ul><div style="display:flex;justify-content:space-between"><span>Subtotal</span><b id="sb">$0</b></div><button class="bt" id="co" style="text-align:center">Continue to checkout</button></aside>
<script>
const P={blue:['#1d3fd8','#6ea8ff','#0b1b4d','#f4d35e'],red:['#e63b2e','#ffb199','#5c0f12','#f7e7c6'],green:['#1f8a4c','#a5e08a','#0d3b2a','#f2a541'],yellow:['#f2c200','#ff8f3f','#3a2a00','#7bb6ff'],pink:['#ff5fa2','#ffc2dc','#5a1240','#2b6cff'],orange:['#ff7a1a','#ffd08a','#4a1f00','#2a7de1']};
const CK=Object.keys(P),S=[['Meditants','2024'],['Landscape of the mind','2025'],['Seascapes','2025'],['Daydreaming','2023'],['Passengers','2023'],['Flowers','2022']];
const N=['The wasp','Night moth','Feast day','Blue horse','Mirage','Monkey and fox','Blue birds','The dance','The stream','Little tiger','The torrent','Revelation','The wolf','Glaciers','The whale','Leopard ray','The kite','The crane','Blue forest','The stag','Night garden','The shark','Midnight','Poppies','The cat','Tropical rain','Terrace','The crossing','Horizon','Sunday market','Pink balloon','The raven','Phoenix','Dolphins','The rainbow','Portrait','Siesta','Lovers'];
const sl=s=>s.toLowerCase().replace(/[^a-z]+/g,'-');
const W=N.map((n,i)=>({i,n,k:sl(n),c:CK[(i*5+i%3)%6],s:S[i%6][0],y:S[i%6][1],p:[420,680,950,1400,2200][i%5],sz:[[60,80],[80,100],[100,120]][i%3]}));
function rg(s){return()=>(s=Math.imul(s^s>>>15,1|s),s=s+Math.imul(s^s>>>7,61|s)^s,((s^s>>>14)>>>0)/4294967296)}
function art(w,seed){const r=rg((seed??w.i)*7919+13),p=P[w.c];let o=`<svg viewBox="0 0 320 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${w.n}, placeholder artwork"><rect width="320" height="400" fill="${p[r()>.5?2:0]}"/>`;
for(let i=0;i<40;i++){const x=r()*320,y=r()*400,d=8+r()*(r()>.8?80:30),f=p[r()*4|0];o+=r()<.55?`<circle cx="${x|0}" cy="${y|0}" r="${d|0}" fill="${f}" opacity=".85"/>`:`<ellipse cx="${x|0}" cy="${y|0}" rx="${d|0}" ry="${d*.45|0}" fill="${f}" transform="rotate(${r()*180|0} ${x|0} ${y|0})"/>`}
o+=`<circle cx="160" cy="250" r="54" fill="${p[1]}"/><circle cx="142" cy="246" r="5" fill="${p[2]}"/><circle cx="178" cy="246" r="5" fill="${p[2]}"/>`;
for(let i=0;i<36;i++)o+=`<circle cx="${r()*320|0}" cy="${r()*400|0}" r="1.6" fill="${p[3]}"/>`;return o+'</svg>'}
const $=q=>document.querySelector(q),V=$('#v');let cart=[],cur=0,col=null;
const $$=h=>V.innerHTML=h;
function home(){$$(`<div id="reel">${S.map((s,i)=>{const w=W.find(x=>x.s===s[0]);return`<a class="fr" href="#s-${sl(s[0])}">${art(w,i+90)}<b>${s[0]}</b></a>`}).join('')}</div>`);const r=$('#reel');r.onwheel=e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();r.scrollLeft+=e.deltaY}}}
function grid(){const L=col?W.filter(w=>w.c===col):W;$$(`<div class="pg"><div class="sub"><a class="${col?'':'on'}" href="#grid">By series</a><a class="${col?'on':''}" href="#grid">By colors</a></div><div class="sw">${CK.map(c=>`<i data-c="${c}" role="button" aria-label="${c}" tabindex="0" style="background:${P[c][0]};outline:${col===c?'2px solid var(--fg)':'0'};outline-offset:2px"></i>`).join('')}</div><div class="gd">${L.map(w=>`<a class="th" href="#w-${w.k}">${art(w)}<span>${w.n}</span></a>`).join('')}</div></div>`);
V.querySelectorAll('.sw i').forEach(e=>e.onclick=()=>{col=col===e.dataset.c?null:e.dataset.c;grid()})}
function series(k){const s=S.find(x=>sl(x[0])===k);if(!s)return home();const L=W.filter(w=>w.s===s[0]);cur=Math.min(cur,L.length-1);
const draw=()=>{const w=L[cur],nx=L[(cur+1)%L.length];$$(`<div class="vw"><div class="L">${s[0]}</div><a class="m" href="#w-${w.k}">${art(w)}</a><div class="R">${nx.n}</div></div><div class="pr">${String(Math.round((cur+1)/L.length*100)).padStart(3,'0')}%</div><div class="st">${L.map((x,i)=>`<button class="${i===cur?'on':''}" data-i="${i}" aria-label="${x.n}">${art(x)}</button>`).join('')}</div>`);
V.querySelectorAll('.st button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()})};draw();
window.onwheel=e=>{if(!location.hash.startsWith('#s-'))return;cur=Math.max(0,Math.min(L.length-1,cur+(e.deltaY>0?1:-1)));draw()};
window.onkeydown=e=>{if(!location.hash.startsWith('#s-'))return;if(e.key==='ArrowRight'||e.key==='ArrowDown')cur=Math.min(L.length-1,cur+1);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')cur=Math.max(0,cur-1);else return;draw()}}
function work(k){const w=W.find(x=>x.k===k);if(!w)return home();$$(`<div class="pd">${art(w)}<div><h1 class="D">${w.n}</h1><p>${w.s}</p><p>Acrylic on canvas</p><p>${w.sz[0]} × ${w.sz[1]} cm</p><p>${w.y}</p><p style="margin-top:8px">$${w.p.toLocaleString('en-US')}</p><button class="bt" id="ad">Select this artwork</button></div><div class="band" style="background:${P[w.c][3]}"></div></div>`);
$('#ad').onclick=()=>{if(!cart.includes(w))cart.push(w);rc();$('#cart').classList.add('o')}}
function collage(t){const n=t==='drawings'?18:14;const pos=rg(t.length*31);$$(`<div class="pg cl">${Array.from({length:n},(_,i)=>{const w=W[(i*3+(t==='drawings'?1:2))%W.length],wd=14+pos()*14;return`<a href="#w-${w.k}" style="left:${pos()*80}%;top:${pos()*55}%;width:${wd}vw;min-width:110px;transform:rotate(${pos()*10-5}deg);z-index:${i}">${art(w,i+200)}</a>`}).join('')}</div>`)}
function about(){$$(`<div class="pg ab"><h1 class="D"><span>Mara</span><span>Veil</span></h1><p>Visual artist and creative director working between painting, drawing and embroidery. Her worlds are crowded with colour, animals and quiet faces.</p><p>Replace this text with your own biography.</p><div class="tb"><span>Year</span><span>Show</span><span>Venue</span><span>City</span><span>2026</span><span>Solo show</span><span>Galerie Example</span><span>Paris</span><span>2025</span><span>Global Series</span><span>Studio Open</span><span>Lisbon</span><span>2024</span><span>Art fair</span><span>Pavilion</span><span>New York</span></div></div>`)}
function contact(){$$(`<div class="ct"><span class="D">Let’s</span><form id="f"><label>Name<br><input required></label><label>Email<br><input type="email" required></label><label>Message<br><textarea rows="3" required></textarea></label><button class="bt" style="text-align:center">Send message</button><small id="ok" aria-live="polite"></small></form><span class="D" style="justify-self:end">Talk</span></div>`);$('#f').onsubmit=e=>{e.preventDefault();$('#ok').textContent='Demo form: connect an email service to receive messages.'}}
function rt(){const h=location.hash.slice(1);scrollTo(0,0);window.onwheel=window.onkeydown=null;
if(h.startsWith('s-'))series(h.slice(2));else if(h.startsWith('w-'))work(h.slice(2));else if(h==='grid')grid();else if(h==='drawings'||h==='embroideries')collage(h);else if(h==='about')about();else if(h==='contact')contact();else home()}
function rc(){$('#cc').textContent=cart.length;$('#cl').innerHTML=cart.length?cart.map((w,i)=>`<li><span>${w.n}</span><button data-r="${i}">Remove</button></li>`).join(''):'<li style="color:var(--mute)">Your cart is empty.</li>';$('#sb').textContent='$'+cart.reduce((a,w)=>a+w.p,0).toLocaleString('en-US')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='cb')$('#cart').classList.add('o');if(t.id==='cx')$('#cart').classList.remove('o');if(t.dataset.r){cart.splice(+t.dataset.r,1);rc()}if(t.id==='co')alert('Demo only: connect Stripe or Shopify to take orders.')});
addEventListener('hashchange',rt);rc();rt();
let n=0;const iv=setInterval(()=>{n=Math.min(100,n+Math.ceil(Math.random()*3));$('#pc').textContent=String(n).padStart(3,'0')+'%';if(n>=100){clearInterval(iv);setTimeout(()=>$('#ld').classList.add('x'),350);setTimeout(()=>$('#ld').remove(),2400)}},50);
</script></body></html>
